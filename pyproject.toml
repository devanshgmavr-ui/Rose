[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rose-agent"
version = "1.1.0"
description = "Rose - Fully Local Autonomous Multimodal AI Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Devansh Gupta"},
]
keywords = ["ai", "agent", "local", "llm", "autonomous", "multimodal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "llama-cpp-python>=0.3.34",
    "Pillow>=12.3.0",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0.3",
    "tqdm>=4.70.0",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "typing-extensions>=4.16.0",
    "diskcache>=5.6.3",
    "Jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "packaging>=26.2",
    "pathspec>=1.1.1",
    "pytesseract>=0.3.13",
    "huggingface-hub>=1.27.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.5.0",
]
browser = [
    "playwright>=1.40.0",
]
vision = [
    "opencv-python>=4.8.0",
]
full = [
    "PySide6>=6.5.0",
    "playwright>=1.40.0",
    "opencv-python>=4.8.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
rose = "run:main"

[project.urls]
Homepage = "https://github.com/devanshgmavr-ui/Rose"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["agent"]
omit = ["tests/*", ".rose/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
]
